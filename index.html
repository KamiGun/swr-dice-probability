<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Калькулятор вероятности кубиков</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 flex items-center justify-center min-h-screen">
    <div class="bg-gray-800 p-6 rounded-lg shadow-lg w-full max-w-3xl">
        <h1 class="text-2xl font-bold mb-4 text-center text-white">Калькулятор вероятности кубиков (для миссий)</h1>
        <p class="text-sm text-gray-300 mb-2">
            <strong>Обычные кубики:</strong> 2 пустые грани, 1 кресты (2 успеха), 1 прямое попадание (1 успех), 2 попадания (1 успех).
        </p>
        <p class="text-sm text-gray-300 mb-4">
            <strong>Зелёные кубики:</strong> 4 пустые грани, 2 прямое попадание (1 успех).
        </p>
        <div class="flex flex-col md:flex-row gap-6 mb-6">
            <!-- Атакующий -->
            <div class="flex-1">
                <h2 class="text-lg font-semibold mb-2 text-white">Атакующий</h2>
                <div class="mb-4">
                    <label for="regularDiceCount" class="block text-sm font-medium text-gray-200">Обычные кубики (0-10):</label>
                    <input type="number" id="regularDiceCount" min="0" max="10" value="3" class="mt-1 block w-full p-2 border border-gray-600 rounded-md bg-gray-700 text-white focus:outline-none focus:ring-2 focus:ring-blue-500" onchange="restrictInput()">
                </div>
                <div class="mb-4">
                    <label for="greenDiceCount" class="block text-sm font-medium text-gray-200">Зелёные кубики (0-3):</label>
                    <input type="number" id="greenDiceCount" min="0" max="3" value="0" class="mt-1 block w-full p-2 border border-gray-600 rounded-md bg-gray-700 text-white focus:outline-none focus:ring-2 focus:ring-blue-500" onchange="restrictInput()">
                </div>
                <div class="mb-4">
                    <label for="attackerBonus" class="flex items-center text-sm font-medium text-gray-200">
                        <input type="checkbox" id="attackerBonus" class="mr-2" onchange="calculateProbabilities()">
                        Гарантированные 2 успеха
                    </label>
                </div>
            </div>
            <!-- Защищающийся -->
            <div class="flex-1">
                <h2 class="text-lg font-semibold mb-2 text-white">Защищающийся</h2>
                <div class="mb-4">
                    <label for="defenderRegularDiceCount" class="block text-sm font-medium text-gray-200">Обычные кубики (0-10):</label>
                    <input type="number" id="defenderRegularDiceCount" min="0" max="10" value="0" class="mt-1 block w-full p-2 border border-gray-600 rounded-md bg-gray-700 text-white focus:outline-none focus:ring-2 focus:ring-blue-500" onchange="restrictInput()">
                </div>
                <div class="mb-4">
                    <label for="defenderGreenDiceCount" class="block text-sm font-medium text-gray-200">Зелёные кубики (0-3):</label>
                    <input type="number" id="defenderGreenDiceCount" min="0" max="3" value="0" class="mt-1 block w-full p-2 border border-gray-600 rounded-md bg-gray-700 text-white focus:outline-none focus:ring-2 focus:ring-blue-500" onchange="restrictInput()">
                </div>
                <div class="mb-4">
                    <label for="defenderBonus" class="flex items-center text-sm font-medium text-gray-200">
                        <input type="checkbox" id="defenderBonus" class="mr-2" onchange="calculateProbabilities()">
                        Гарантированные 2 успеха
                    </label>
                </div>
            </div>
        </div>
        <div id="results" class="mt-4 text-sm text-gray-200"></div>
    </div>

    <script>
        // Константы для вероятностей граней кубиков
        const DICE_PROBS = {
            regular: {
                empty: 2/6,
                success: 4/6,
                cross: 1/6,
                singleSuccess: 3/6
            },
            green: {
                empty: 4/6,
                success: 2/6
            }
        };

        // Точность значений после запятой
        const numPrecision = 2;

        function getExponent(str) {
            const match = str.match(/e-(\d+)/);
            return match ? parseFloat(match[1]) : null;
        }

        function getDecimalPlaces(num) {
            let str = num.toString();
            let decimalIndex = str.indexOf('.');
            if (decimalIndex === -1) return 0;
            let fractionalPart = str.slice(decimalIndex + 1);
            if (!fractionalPart) return 0;
            let nonNineIndex = fractionalPart.split('').findIndex(digit => digit !== '9');
            if (nonNineIndex === -1) return fractionalPart.length;
            return nonNineIndex + 1;
        }

        function customToFixed(value) {
            if (value === 0) return '0.00';
            if (value > 99) return value.toFixed(getDecimalPlaces(value) + (numPrecision - 1));
            if (value >= 0.01) return value.toFixed(numPrecision);
            let str = value.toExponential(1);
            return value.toFixed(getExponent(str) + (numPrecision - 1));
        }

        function restrictDiceInput(regularInputId, greenInputId) {
            const regularInput = document.getElementById(regularInputId);
            const greenInput = document.getElementById(greenInputId);
            regularInput.value = Math.max(0, Math.min(10, parseInt(regularInput.value) || 0));
            greenInput.value = Math.max(0, Math.min(3, parseInt(greenInput.value) || 0));
            const total = parseInt(regularInput.value) + parseInt(greenInput.value);
            if (total > 13) {
                greenInput.value = Math.max(0, 13 - parseInt(regularInput.value));
                if (greenInput.value > 3) {
                    regularInput.value = 10;
                    greenInput.value = 3;
                }
            }
        }

        function restrictInput() {
            restrictDiceInput('regularDiceCount', 'greenDiceCount');
            restrictDiceInput('defenderRegularDiceCount', 'defenderGreenDiceCount');
            calculateProbabilities();
        }

        function calculatePlayerProbabilities(nRegular, nGreen, hasBonus, maxSuccesses) {
            const bonusSuccesses = hasBonus ? 2 : 0;
            const totalDice = nRegular + nGreen;
            if (totalDice === 0 && !hasBonus) return null;

            const probAllEmpty = hasBonus ? 0 : Math.pow(DICE_PROBS.regular.empty, nRegular) * Math.pow(DICE_PROBS.green.empty, nGreen);
            const probAtLeastOneSuccess = hasBonus ? 1 : 1 - probAllEmpty;
            const probAtLeastOneCross = nRegular > 0 ? 1 - Math.pow(1 - DICE_PROBS.regular.cross, nRegular) : 0;
            const expectedSuccesses = nRegular * (DICE_PROBS.regular.cross * 2 + DICE_PROBS.regular.singleSuccess) + nGreen * DICE_PROBS.green.success + bonusSuccesses;
            const successProbabilities = calculateSuccessProbabilities(nRegular, nGreen, maxSuccesses, hasBonus);

            return {
                totalDice,
                nRegular,
                nGreen,
                hasBonus,
                probAllEmpty,
                probAtLeastOneSuccess,
                probAtLeastOneCross,
                expectedSuccesses,
                successProbabilities,
                maxSuccesses
            };
        }

        function formatPlayerResults(playerData, title) {
            if (!playerData) {
                return `<div class="flex-1">
                    <h2 class="text-lg font-semibold mb-2">${title}</h2>
                    <p>${title} не использует кубики и не имеет гарантированного успеха.</p>
                </div>`;
            }

            let successProbHtml = '<p><strong>Вероятности по количеству успеха:</strong></p><ul>';
            for (let k = 0; k <= playerData.maxSuccesses; k++) {
                successProbHtml += `<li>${k} успех: ${customToFixed(playerData.successProbabilities[k] * 100)}%</li>`;
            }
            successProbHtml += '</ul>';

            return `<div class="flex-1">
                <h2 class="text-lg font-semibold mb-2">${title}</h2>
                <p><strong>Всего кубиков:</strong> ${playerData.totalDice} (Обычные: ${playerData.nRegular}, Зелёные: ${playerData.nGreen})${playerData.hasBonus ? ', +2 гарантированных успеха' : ''}</p>
                <p><strong>Вероятность всех пустых граней:</strong> ${customToFixed(playerData.probAllEmpty * 100)}%</p>
                <p><strong>Вероятность хотя бы 1 успеха:</strong> ${customToFixed(playerData.probAtLeastOneSuccess * 100)}%</p>
                <p><strong>Вероятность хотя бы 1 креста (2 успеха от кубиков):</strong> ${customToFixed(playerData.probAtLeastOneCross * 100)}%</p>
                <p><strong>Ожидаемое количество успеха:</strong> ${customToFixed(playerData.expectedSuccesses)}</p>
                ${successProbHtml}
            </div>`;
        }

        function calculateProbabilities() {
            const nRegular = parseInt(document.getElementById('regularDiceCount').value);
            const nGreen = parseInt(document.getElementById('greenDiceCount').value);
            const nDefenderRegular = parseInt(document.getElementById('defenderRegularDiceCount').value);
            const nDefenderGreen = parseInt(document.getElementById('defenderGreenDiceCount').value);
            const attackerBonus = document.getElementById('attackerBonus').checked;
            const defenderBonus = document.getElementById('defenderBonus').checked;
            const attackerTotal = nRegular + nGreen;
            const defenderTotal = nDefenderRegular + nDefenderGreen;

            if (attackerTotal === 0 && !attackerBonus && defenderTotal === 0 && !defenderBonus) {
                document.getElementById('results').innerHTML = '<p class="text-red-400">Выберите хотя бы один кубик или гарантированные успехи для атакующего или защищающегося.</p>';
                return;
            }

            const maxSuccessesAttacker = 2 * nRegular + nGreen + (attackerBonus ? 2 : 0);
            const maxSuccessesDefender = 2 * nDefenderRegular + nDefenderGreen + (defenderBonus ? 2 : 0);

            const attackerData = calculatePlayerProbabilities(nRegular, nGreen, attackerBonus, maxSuccessesAttacker);
            const defenderData = calculatePlayerProbabilities(nDefenderRegular, nDefenderGreen, defenderBonus, maxSuccessesDefender);

            let resultsHtml = '<div class="flex flex-col md:flex-row gap-6">';
            resultsHtml += formatPlayerResults(attackerData, 'Атакующий');
            resultsHtml += formatPlayerResults(defenderData, 'Защищающийся');
            resultsHtml += '</div>';

            // Вероятность победы атакующего
            if ((attackerTotal > 0 || attackerBonus) && (defenderTotal > 0 || defenderBonus)) {
                const attackerProbs = attackerData.successProbabilities;
                const defenderProbs = defenderData.successProbabilities;
                let winProbability = 0;
                for (let sa = 0; sa <= maxSuccessesAttacker; sa++) {
                    for (let sd = 0; sd <= maxSuccessesDefender; sd++) {
                        if (sa > sd) {
                            winProbability += attackerProbs[sa] * defenderProbs[sd];
                        }
                    }
                }
                resultsHtml += `
                    <h2 class="text-lg font-semibold mb-2 mt-4">Вероятность победы</h2>
                    <p><strong>Вероятность победы атакующего:</strong> ${customToFixed(winProbability * 100)}%</p>
                `;
            } else if (attackerTotal > 0 || attackerBonus) {
                const probAllEmpty = attackerData.probAllEmpty;
                const probAtLeastOneSuccess = 1 - probAllEmpty;
                resultsHtml += `
                    <h2 class="text-lg font-semibold mb-2 mt-4">Вероятность победы</h2>
                    <p><strong>Вероятность победы атакующего:</strong> ${customToFixed(probAtLeastOneSuccess * 100)}%</p>
                `;
            } else {
                resultsHtml += `
                    <h2 class="text-lg font-semibold mb-2 mt-4">Вероятность победы</h2>
                    <p><strong>Вероятность победы атакующего:</strong> 0.00%</p>
                `;
            }

            document.getElementById('results').innerHTML = resultsHtml;
        }

        function calculateSuccessProbabilities(nRegular, nGreen, maxSuccesses, hasBonus) {
            const probs = new Array(maxSuccesses + 1).fill(0);
            const pRegular = [DICE_PROBS.regular.empty, DICE_PROBS.regular.singleSuccess, DICE_PROBS.regular.cross];
            const pGreen = [DICE_PROBS.green.empty, DICE_PROBS.green.success];

            let dp = new Array(maxSuccesses + 1).fill(0);
            dp[0] = 1;

            for (let i = 0; i < nRegular; i++) {
                const newDp = new Array(maxSuccesses + 1).fill(0);
                for (let prev = 0; prev <= maxSuccesses; prev++) {
                    for (let s = 0; s <= 2 && prev + s <= maxSuccesses; s++) {
                        newDp[prev + s] += dp[prev] * pRegular[s];
                    }
                }
                dp = newDp;
            }

            for (let i = 0; i < nGreen; i++) {
                const newDp = new Array(maxSuccesses + 1).fill(0);
                for (let prev = 0; prev <= maxSuccesses; prev++) {
                    for (let s = 0; s <= 1 && prev + s <= maxSuccesses; s++) {
                        newDp[prev + s] += dp[prev] * pGreen[s];
                    }
                }
                dp = newDp;
            }

            if (hasBonus) {
                const newProbs = new Array(maxSuccesses + 1).fill(0);
                for (let k = 0; k <= maxSuccesses - 2; k++) {
                    newProbs[k + 2] = dp[k];
                }
                return newProbs;
            }

            return dp;
        }

        calculateProbabilities();
    </script>
</body>
</html>
